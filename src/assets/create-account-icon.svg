<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square background -->
  <rect x="20" y="20" width="160" height="160" rx="32" fill="#1e3a8a" opacity="0.3" stroke="#2563eb" stroke-width="2"/>
  
  <!-- User circle (head) -->
  <circle cx="100" cy="70" r="20" fill="none" stroke="#93c5fd" stroke-width="6"/>
  
  <!-- User body (curved) -->
  <path d="M 75 95 Q 75 85 100 85 Q 125 85 125 95 L 125 130 Q 125 145 100 145 Q 75 145 75 130 Z" 
        fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Plus sign -->
  <g>
    <!-- Vertical line of plus -->
    <line x1="145" y1="55" x2="145" y2="105" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
    <!-- Horizontal line of plus -->
    <line x1="120" y1="80" x2="170" y2="80" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>